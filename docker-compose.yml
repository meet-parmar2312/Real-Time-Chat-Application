version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: real_time_chat_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat_password}
      POSTGRES_DB: ${POSTGRES_DB:-chat_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chat_user} -d ${POSTGRES_DB:-chat_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: real_time_chat_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PROJECT_NAME=Real-Time Chat Application
      - ENV=development
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-c8e9b4d3f2a10786e5d4c3b2a19087e6d5c4b3a21908e7d6c5b4a3928170f6e5}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-chat_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-chat_password}
      - POSTGRES_DB=${POSTGRES_DB:-chat_db}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-chat_user}:${POSTGRES_PASSWORD:-chat_password}@postgres:5432/${POSTGRES_DB:-chat_db}
      - BACKEND_CORS_ORIGINS=["*"]
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
