<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Real-Time Chat Test Client</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 760px; background: #1e293b; border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { margin-top: 0; font-size: 1.5rem; color: #38bdf8; display: flex; align-items: center; justify-content: space-between; }
    .badge { font-size: 0.8rem; padding: 4px 10px; border-radius: 9999px; font-weight: bold; }
    .badge.offline { background: #ef4444; color: white; }
    .badge.online { background: #22c55e; color: white; }
    .card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: #94a3b8; }
    input, textarea { width: 100%; padding: 10px; background: #1e293b; border: 1px solid #475569; border-radius: 6px; color: white; font-size: 0.95rem; }
    input:focus, textarea:focus { outline: none; border-color: #38bdf8; }
    .btn-row { display: flex; gap: 10px; }
    button { cursor: pointer; padding: 10px 18px; border: none; border-radius: 6px; font-weight: 600; font-size: 0.95rem; transition: background 0.2s; }
    .btn-primary { background: #0284c7; color: white; }
    .btn-primary:hover { background: #0369a1; }
    .btn-danger { background: #dc2626; color: white; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-secondary { background: #334155; color: #f8fafc; }
    .btn-secondary:hover { background: #475569; }
    #logBox { height: 280px; overflow-y: auto; background: #090d16; border: 1px solid #334155; border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 8px; font-family: monospace; font-size: 0.85rem; }
    .msg-item { padding: 8px 12px; border-radius: 6px; }
    .msg-incoming { background: #1e3a8a; border-left: 4px solid #60a5fa; align-self: flex-start; max-width: 80%; }
    .msg-ack { background: #064e3b; border-left: 4px solid #34d399; align-self: flex-end; max-width: 80%; }
    .msg-sys { background: #334155; color: #cbd5e1; align-self: center; font-size: 0.8rem; }
    .msg-err { background: #7f1d1d; border-left: 4px solid #f87171; }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      Real-Time Chat Test Client
      <span id="statusBadge" class="badge offline">OFFLINE</span>
    </h1>

    <div class="card">
      <div style="display: grid; grid-template-columns: 1fr 140px; gap: 12px;">
        <div class="form-group">
          <label>JWT Access Token</label>
          <input type="text" id="tokenInput" placeholder="eyJhbGciOiJIUzI1NiIsIn..." />
        </div>
        <div class="form-group">
          <label>Conversation ID</label>
          <input type="number" id="convIdInput" value="1" />
        </div>
      </div>
      <div class="btn-row">
        <button id="connectBtn" class="btn-primary" onclick="toggleConnect()">Connect WebSocket</button>
        <button class="btn-secondary" onclick="clearLogs()">Clear Logs</button>
      </div>
    </div>

    <div class="card">
      <label>Messages & Events Log</label>
      <div id="logBox"></div>
    </div>

    <div class="card" style="margin-bottom: 0;">
      <div class="form-group">
        <label>Message Content</label>
        <input type="text" id="messageInput" placeholder="Type a message and press Enter..." onkeypress="if(event.key === 'Enter') sendMessage()" />
      </div>
      <button class="btn-primary" onclick="sendMessage()">Send Message</button>
    </div>
  </div>

  <script>
    let ws = null;
    const badge = document.getElementById("statusBadge");
    const connectBtn = document.getElementById("connectBtn");
    const logBox = document.getElementById("logBox");

    function log(text, type = "sys") {
      const div = document.createElement("div");
      div.className = `msg-item msg-${type}`;
      div.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function clearLogs() {
      logBox.innerHTML = "";
    }

    function toggleConnect() {
      if (ws) {
        ws.close();
        return;
      }
      const token = document.getElementById("tokenInput").value.trim();
      const convId = document.getElementById("convIdInput").value.trim();
      if (!token) {
        alert("Please enter a JWT token (obtain from /api/v1/auth/login)");
        return;
      }
      if (!convId) {
        alert("Please enter a valid Conversation ID");
        return;
      }

      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const host = window.location.host || "localhost:8000";
      const wsUrl = `${protocol}//${host}/ws/conversations/${convId}?token=${encodeURIComponent(token)}`;

      log(`Connecting to ${wsUrl}...`, "sys");
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        badge.className = "badge online";
        badge.innerText = "ONLINE";
        connectBtn.className = "btn-danger";
        connectBtn.innerText = "Disconnect";
        log("WebSocket connection established.", "sys");
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.event === "ack") {
            log(`ACK received for message ${data.message_id} (Status: ${data.status})`, "ack");
          } else if (data.event === "error") {
            log(`Server Error: ${data.detail}`, "err");
          } else {
            log(`From User ${data.sender_id}: "${data.content}" [ID: ${data.message_id}]`, "incoming");
          }
        } catch (e) {
          log(`Raw payload: ${event.data}`, "incoming");
        }
      };

      ws.onerror = (err) => {
        log("WebSocket encountered an error.", "err");
      };

      ws.onclose = (event) => {
        ws = null;
        badge.className = "badge offline";
        badge.innerText = "OFFLINE";
        connectBtn.className = "btn-primary";
        connectBtn.innerText = "Connect WebSocket";
        log(`WebSocket closed (Code: ${event.code}).`, "sys");
      };
    }

    function sendMessage() {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        alert("WebSocket is not connected!");
        return;
      }
      const input = document.getElementById("messageInput");
      const content = input.value.trim();
      if (!content) return;

      const payload = { content: content };
      ws.send(JSON.stringify(payload));
      log(`Sent: "${content}"`, "sys");
      input.value = "";
    }
  </script>
</body>
</html>
